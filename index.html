<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>safebite-india</title>
    <!-- Applies the saved theme before React (or even the CSS) has a
         chance to paint anything -- without this, a dark-mode user would
         see a flash of the light page for a moment on every load. Kept
         in sync with src/hooks/useTheme.js's storage key/logic. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('safebite-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (pref === 'dark' || (pref === 'system' && systemDark)) root.classList.add('dark');
          else if (pref === 'light') root.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
