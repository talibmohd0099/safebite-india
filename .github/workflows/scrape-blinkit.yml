name: Scrape Blinkit

# Runs the Blinkit scraper on a schedule, free of charge.
#
# This used to be a Netlify scheduled function firing every minute,
# which burned through the plan's credits and got production deploys
# paused. GitHub Actions gives public repositories unlimited minutes,
# and a scraper doesn't need a web host anyway — it writes straight to
# Supabase, so Netlify is no longer involved.
#
# Each run resumes from where the last one stopped (tracked in the
# blinkit_seed_progress table), so the categories advance steadily
# rather than re-scraping their opening products every time.

on:
  # Schedule is OFF (2026-09-10, still off 2026-09-25): Blinkit was
  # returning plain 403 Forbidden on every request from 2026-09-10, which
  # blinkit.js worked around (2026-09-25) by solving Cloudflare's JS
  # challenge with a real headless browser once per run and reusing the
  # two cookies it sets for the rest of that run's plain curl requests --
  # see the comment above refreshCloudflareCookies() there for the full
  # story. That fix is confirmed working from a residential IP (a real
  # scrape saved real products). It is NOT yet confirmed from GitHub
  # Actions' own datacenter IP range, which anti-bot systems generally
  # score far more suspiciously than a residential one regardless of
  # whether the JS challenge is solved -- the escalation to a JS
  # challenge in the first place was most likely a reaction to sustained
  # automated traffic during development, and a shared CI IP re-running
  # every 2 hours is exactly the pattern that invites another escalation.
  # Try a manual "Run workflow" first and confirm it actually saves
  # products before uncommenting the schedule below.
  #
  # schedule:
  #   - cron: '0 */2 * * *'
  #
  # Adds a "Run workflow" button on the Actions tab for running it on demand.
  workflow_dispatch:
    inputs:
      per_category:
        description: 'Products to fetch per category this run'
        required: false
        default: '10'

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Well under the 6h ceiling; a normal run is roughly 25-30 minutes.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # blinkit.js now needs a real browser to solve Blinkit's Cloudflare
      # challenge once per run (see this file's schedule comment above and
      # the comment above refreshCloudflareCookies() in blinkit.js) --
      # `npm ci` installs the playwright package but not its browser
      # binary, which is a separate download.
      - run: npx playwright install --with-deps chromium

      - name: Scrape
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
          VITE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.VITE_CLOUDFLARE_ACCOUNT_ID }}
          VITE_CLOUDFLARE_API_TOKEN: ${{ secrets.VITE_CLOUDFLARE_API_TOKEN }}
        run: node scripts/scrape-blinkit.js --all --per-category ${{ github.event.inputs.per_category || '10' }} --no-ai
